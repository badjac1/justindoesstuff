trigger: none

schedules:
- cron: "*/5 * * * *"
  displayName: Poll upstream
  branches:
    include: [master]
  always: true

pool:
  name: default

steps:
- checkout: self
  clean: true
  persistCredentials: true

- bash: |
    set -e
    upstream=$(git ls-remote https://github.com/badjac1/justindoesstuff.git refs/heads/main | cut -f1)
    [ -n "$upstream" ] || { echo "ls-remote failed"; exit 1; }
    last=$(cat last-sha.txt 2>/dev/null || true)
    if [ "$upstream" = "$last" ]; then
      echo "No change ($upstream)"
      exit 0
    fi
    echo "$upstream" > last-sha.txt
    git config user.email "pipeline@local"
    git config user.name "poller"
    git add last-sha.txt
    git commit -m "Upstream moved to $upstream"
    git push origin HEAD:master
  displayName: Detect change and record SHA