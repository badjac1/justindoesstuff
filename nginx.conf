server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Cache rules use "expires" rather than add_header, so the security
    # headers above still apply inside these locations.

    location / {
        try_files $uri $uri/ =404;
    }

    # The photos folder lists its contents as JSON, so the site can find
    # portfolios (sub-folders) and their images without a hand-kept list.
    location /photos/ {
        autoindex on;
        autoindex_format json;

        # Folder listings: always check for new photos.
        location ~ /$ {
            autoindex on;
            autoindex_format json;
            expires -1;
        }

        # The images themselves can be cached for a while.
        location ~* \.(jpe?g|png|webp|gif|avif)$ {
            expires 7d;
        }
    }

    # Zine issues: one folder each (issue.md + images), listed as JSON so the
    # site can find them without a hand-kept list.
    location /zines/ {
        autoindex on;
        autoindex_format json;

        # Folder listings and the text itself: always fresh.
        location ~ /$ {
            autoindex on;
            autoindex_format json;
            expires -1;
        }
        location ~* \.md$ {
            default_type text/markdown;
            charset utf-8;
            expires -1;
        }

        location ~* \.(jpe?g|png|webp|gif|avif)$ {
            expires 7d;
        }
    }

    # Keep the site's own files fresh after a redeploy.
    location ~* \.(?:html|js|css)$ {
        expires -1;
        try_files $uri =404;
    }

    # Other static assets can be cached.
    location ~* \.(?:svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
    location = /nginx.conf { deny all; }
}
